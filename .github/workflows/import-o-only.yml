name: Import pinned O-only source snapshot

on:
  push:
    paths:
      - .github/workflows/import-o-only.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Import exact source snapshot without Git history
        shell: bash
        env:
          SOURCE_COMMIT: 436ed30c894c4060638341ecebe82004d457f496
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/plan2001-upstream"
          snapshot="$RUNNER_TEMP/plan2001-snapshot"
          git clone --quiet --depth 1 --branch poc-o-only https://github.com/pereuna/Plan2001.git "$src"
          actual="$(git -C "$src" rev-parse HEAD)"
          if [ "$actual" != "$SOURCE_COMMIT" ]; then
            echo "::error::Source branch moved: $actual != $SOURCE_COMMIT"
            exit 1
          fi
          mkdir -p "$snapshot"
          git -C "$src" archive "$SOURCE_COMMIT" | tar -xf - -C "$snapshot"
          rsync -a \
            --exclude='README.md' \
            --exclude='AGENTS.md' \
            --exclude='.claude/' \
            --exclude='docs/' \
            --exclude='init' \
            "$snapshot/" ./

          # Keep only the relevant O format specification, not contradictory
          # legacy architecture/status/requirements histories.
          mkdir -p docs
          cp "$snapshot/docs/o-volume-format.md" docs/o-volume-format.md
          cat > docs/STATUS.md <<'EOF'
          # Implementation status — imported O-only PoC

          Source snapshot: `pereuna/Plan2001`, branch `poc-o-only`,
          commit `436ed30c894c4060638341ecebe82004d457f496`
          (20 October 2026). Imported as a fresh source tree, **without
          upstream Git ancestry**.

          ## Demonstrated by source-branch test logs

          - Native GE/O partition access without an FS root.
          - Stable SpaceID-scoped OIDs, GE-backed versioned objects, commits.
          - MicroPython Environment and verified `.mpy` code loaded from O.
          - Embedded MicroPython boots persistent `init` Space from O.
          - QEMU test `tools/test-o-boot.sh` ran three sequential boots
            from the same ESP + O disk: counter 1, 2, 3, with the same OID
            and alias preserved; no filesystem root was mounted.

          These are test results documented in the **source repository**,
          not a claim that the imported repository has been rebuilt and
          re-tested after migration.

          ## Still experimental / not implemented

          - GE/O-native relationship graph and persistent namespace bindings.
          - Per-Python-object native O records; currently an entire persistent
            Python graph is committed as one `OID_GRAPH` object.
          - General OID-based native executable loader (current interpreter
            is kernel-embedded via legacy `devroot`).
          - General-purpose O-resident Python package management.
          - Fully designed process-local object handle lifecycle, access
            control, object IPC, or remote object protocol.
          - Production-grade corruption recovery, hardware validation,
            performance or concurrency guarantees.

          ## Regression commands

          ```sh
          WHAT=kernel tools/build.sh
          tools/test-o-volume.sh
          tools/test-o-objects.sh
          tools/test-o-space.sh
          tools/test-o-boot.sh
          ```

          These commands require the repository's existing 9front/QEMU host
          build environment. Their presence is not evidence they have
          passed in this new repository. The first task after migration is
          to run these gates before structural source pruning.

          See [README.md](../README.md) for active architecture and
          [o-volume-format.md](o-volume-format.md) for the implemented
          on-disk format.
          EOF
          cat > docs/PoC-experimental-demo.md <<'EOF'
          # O-only proof of concept — five achieved gates

          This file records the **implemented minimal demonstration** from
          `pereuna/Plan2001` at `436ed30`, not the complete object-native
          architecture of the new repository. Details of the native on-disk
          representation are in [o-volume-format.md](o-volume-format.md).

          1. GE opens the raw volume without a filesystem root or 9P service.
             Test: `tools/test-ge.sh`.
          2. A native O-profile volume carries a flat `init` Space catalog.
             Test: `tools/test-o-volume.sh`.
          3. O objects are addressed by `(SpaceID, OID)` and versioned.
             Test: `tools/test-o-objects.sh`.
          4. MicroPython loads its Environment, compiled code and persistent
             state from O rather than filesystem paths.
             Test: `tools/test-o-space.sh`.
          5. The same ESP + O QEMU disk boots three times, invoking a
             persistent `run()` with counter 1 -> 2 -> 3 and a stable alias.
             Test: `tools/test-o-boot.sh`.

          **Important limitation:** Stage 5 persists the Python graph as
          one native O object (`OID_GRAPH`). Native GE/O graph relations,
          incremental individual Python-object storage, and loading
          executable programs directly from O are **new research tasks**.

          Development rule: preserve the proven vertical slice, experiment
          with new native GE/O semantics, and never solve a missing object
          operation by constructing a filesystem or 9P compatibility layer.

          Current direction: [README.md](../README.md).
          EOF
          cat > AGENTS.md <<'EOF'
          # Plan2001-O — instructions for coding agents

          Read [README.md](README.md) and [docs/STATUS.md](docs/STATUS.md)
          first. They supersede the old Plan9/9front project documentation.

          ## Active architectural hypothesis

          - GE/O is a native persistent object **and relationship graph**.
          - Identity is `(SpaceID, OID)`; paths are not object identities.
          - Python replaces rc/sh/awk/init and demonstrates persistent
            namespaces, code, functions, and values. GE/O is not Python-specific.
          - Native executable binaries, text and other content types belong
            in GE/O; eventually the kernel loads executables by object ID.
          - A native object process/IPC/remote protocol remains undecided.

          ## Boundaries

          - Do **not** introduce a flat filesystem, 9P adapter, fake
            file-backed object store, path-based native O API, or
            compatibility namespace to bypass open design decisions.
          - Useful byte offset operations and per-process resource handles
            are allowed; they do not imply a filesystem hierarchy.
          - Existing Plan 9 implementation code may be retained temporarily
            to keep the proven PoC buildable. Its design is not a goal.
          - Do not assume the native relationship graph or direct O-exec
            already exists. The current Python persistence still rewrites
            an entire `OID_GRAPH` object.
          - Prefer small reversible experiments with precise QEMU evidence.
            Do not run destructive image-reformatting tools against real disks.
          - Keep upstream `LICENSE` and provenance; source migration did
            not change code ownership or license obligations.

          Preserve `tools/test-o-boot.sh` and the other O regression tests
          while simplifying legacy dependencies. Report actual commands,
          passes, failures and unknowns; do not infer tests from source code.
          EOF

          # Exact source integrity checks for every preserved upstream file.
          python3 - "$src" "$snapshot" <<'PY'
          import os, subprocess, sys
          repo, snapshot = sys.argv[1:]
          raw = subprocess.check_output(
              ["git", "-C", repo, "ls-tree", "-rz", "HEAD"])
          count = 0
          skips = ("docs/", ".claude/")
          for record in raw.split(b"\x00"):
              if not record:
                  continue
              metadata, path = record.split(b"\t", 1)
              mode, typ, expected = metadata.split()
              name = path.decode("utf-8", "surrogateescape")
              if (name in ("README.md", "AGENTS.md", "init")
                  or name.startswith(skips)):
                  continue
              actual_path = os.path.join(".", name)
              if not os.path.lexists(actual_path):
                  raise SystemExit(f"Missing file: {name}")
              actual = subprocess.check_output(
                  ["git", "hash-object", "--", actual_path]).strip()
              if actual != expected:
                  raise SystemExit(f"Checksum mismatch: {name}")
              if (mode == b"100755") != os.access(actual_path, os.X_OK):
                  raise SystemExit(f"Executable mode mismatch: {name}")
              count += 1
          print(f"Verified {count} upstream file blobs, SHA-1 and executability")
          PY

          # This is a one-time import: don't leave a powerful importer in
          # the new repository or rerun it on future README changes.
          rm -f .github/workflows/import-o-only.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Unexpected empty migration"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'import: pinned poc-o-only working tree without source history'
          git push origin HEAD:main
          echo "Imported pinned source to main; old history and legacy docs omitted"
